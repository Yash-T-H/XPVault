<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Sign Up - XPVault</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-image: url(sotc.jpeg);"></body>
    <header>
        <a href="index.html" class="logo">XP<span>Vault</span></a>
        <nav>
            <a href="index.html">Home</a>
            <a href="games.html">Games</a>
            <a href="suggest.html">Suggest Games</a>
            <a href="cart.html">Cart</a>
            <a href="login.html" class="btn active">Login / Sign Up</a>
        </nav>
    </header>

    <main>
        <div class="form-container">
            <h2 style="margin-bottom: 2rem; text-align: center;">Welcome to XPVault</h2>
            
            <form action="#" method="POST">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" placeholder="Enter your password" required>
                </div>
                
                <button type="submit" class="btn" style="width: 100%;">Login</button>
                
                <div style="margin-top: 1.5rem; text-align: center; color: var(--text-muted); font-size: 0.95rem;">
                    Don't have an account? 
                    <a href="signup.html" style="color: var(--accent); text-decoration: none; font-weight: 500;">Sign up</a>
                </div>
            </form>
        </div>
    </main>
    <script>
        document.querySelector('form').addEventListener('submit', function(e) {
            const password = document.querySelector('input[type="password"]').value;
            if (password.length < 8) {
                e.preventDefault();
                alert('Password must be at least 8 characters long.');
            }
        });
    </script>
</body>
</html>
